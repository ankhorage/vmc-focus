<sbb-header [expanded]="true" size="s">
  <sbb-header-button
    class="mobile-navigation-trigger"
    type="button"
    aria-controls="primary-navigation"
    [attr.aria-expanded]="mobileNavigationOpen()"
    (click)="openMobileNavigation()"
  >
    Menü
  </sbb-header-button>

  <a
    class="brand"
    routerLink="/triage"
    aria-label="VMC Focus – Triage-Posteingang"
  >
    <span class="brand__name">VMC Focus</span>
    <span class="brand__section">Schwachstellenmanagement</span>
  </a>

  <sbb-header-environment>Demo</sbb-header-environment>
</sbb-header>

<sbb-sidebar-container class="app-layout">
  <sbb-sidebar
    id="primary-navigation"
    color="white"
    position="start"
    [mode]="sidebarMode()"
    [opened]="sidebarOpened()"
    (close)="closeMobileNavigation()"
  >
    <sbb-sidebar-title level="2" visualLevel="5">
      Navigation
    </sbb-sidebar-title>

    <nav class="primary-navigation" aria-label="Hauptnavigation">
      <a
        class="primary-navigation__link"
        routerLink="/triage"
        routerLinkActive="primary-navigation__link--active"
        ariaCurrentWhenActive="page"
        (click)="closeMobileNavigation()"
      >
        Triage-Posteingang
      </a>
    </nav>
  </sbb-sidebar>

  <sbb-sidebar-content>
    <sbb-container
      class="app-content"
      [expanded]="true"
      [backgroundExpanded]="true"
      color="milk"
    >
      <router-outlet />
    </sbb-container>
  </sbb-sidebar-content>
</sbb-sidebar-container>
